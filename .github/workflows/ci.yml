name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR 브랜치는 새 푸시가 오면 이전 실행을 취소한다. main은 실행마다 그룹을 따로 줘서
  # 연달아 병합돼도 앞선 커밋의 이미지 게시(publish)가 취소되지 않게 한다.
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # main에 병합됐을 때만 이미지를 GHCR에 올린다. PR에서는 올리지 않는다.
  publish:
    needs: [check, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 태그는 커밋 SHA만 쓴다. latest 같은 움직이는 태그는 배포 추적이 안 돼서 만들지 않는다.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
      # 이미지가 올라가면 infra 레포의 이미지 태그를 이 커밋으로 바꿔 Argo CD가 자동 배포하게 한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swyp-web16th-team2/infra
          ref: main
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          path: infra
      - name: infra 이미지 태그 갱신
        working-directory: infra
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          # 그 사이 main에 더 새 커밋이 들어왔으면 건너뛴다. 오래된 커밋이 늦게 끝나 옛 버전으로 되돌리는 것을 막는다.
          tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "main이 더 새 커밋($tip)으로 넘어가서 태그 갱신을 건너뜁니다."
            exit 0
          fi
          sed -i "s#^\( *image: \)ghcr\.io/.*#\1${IMAGE}#" apps/backend/deployment.yaml
          grep -q "image: ${IMAGE}$" apps/backend/deployment.yaml
          if git diff --quiet; then echo "이미 같은 태그입니다."; exit 0; fi
          git config user.name "backend-ci"
          git config user.email "backend-ci@users.noreply.github.com"
          git commit -qam "chore: backend 이미지 태그를 ${GITHUB_SHA::7}로 갱신"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull -q --rebase origin main
          done
          exit 1
