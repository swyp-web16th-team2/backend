name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR 브랜치는 새 푸시가 오면 이전 실행을 취소한다. main은 실행마다 그룹을 따로 줘서
  # 연달아 병합돼도 앞선 커밋의 이미지 게시(publish)가 취소되지 않게 한다.
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # e2e가 실제 DB·Redis에 연결해 보도록 서비스 컨테이너를 같이 띄운다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: swyp
          POSTGRES_PASSWORD: swyp
          POSTGRES_DB: swyp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swyp -d swyp"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://swyp:swyp@localhost:5432/swyp
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 마이그레이션 변경 확인에 main과의 비교가 필요하다
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # 테스트 코드까지 포함한 전체 타입 검사. Vitest와 린트는 타입 오류를 잡지 못한다.
      - run: npm run typecheck
      # 이미 병합된 마이그레이션을 고치거나 지우면 운영 DB에 적용하는 migrate deploy가 아무 경고 없이 넘어간다.
      # 그래서 PR에서 막는다. 새 마이그레이션을 추가하는 것만 허용한다(docs/migrations.md).
      - name: 이미 있는 마이그레이션을 고치거나 지우지 않았는지 확인
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # git diff가 실패하면(기준 브랜치를 못 찾는 등) 여기서 바로 실패한다. 파이프에 넣으면 실패가 묻힌다.
          git diff --name-status "origin/${BASE_REF}...HEAD" -- prisma/migrations > "$RUNNER_TEMP/migration-diff.txt"
          changed=$(grep -v '^A' "$RUNNER_TEMP/migration-diff.txt" || true)
          if [ -n "$changed" ]; then
            echo "::error::이미 있는 마이그레이션 파일이 바뀌었습니다. 새 마이그레이션을 추가하세요(docs/migrations.md)."
            echo "$changed"
            exit 1
          fi
      # schema.prisma만 바꾸고 마이그레이션을 빠뜨리면 코드와 DB가 어긋난다. 깨끗한 DB를 새로 만들어 마이그레이션만 적용한 뒤
      # schema.prisma와 비교해서 잡는다(내 로컬 DB에 남은 수동 변경에 가려지지 않는다). 모델이 아직 없는 지금 상태에서도 통과한다.
      - name: schema.prisma와 마이그레이션이 같은지 확인
        env:
          DIRECT_URL: postgresql://swyp:swyp@localhost:5432/swyp_migration_check
        run: |
          PGPASSWORD=swyp psql -h localhost -U swyp -d swyp -v ON_ERROR_STOP=1 -c 'CREATE DATABASE swyp_migration_check'
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # main에 병합됐을 때만 이미지를 GHCR에 올린다. PR에서는 올리지 않는다.
  publish:
    needs: [check, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 태그는 커밋 SHA만 쓴다. latest 같은 움직이는 태그는 배포 추적이 안 돼서 만들지 않는다.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha

  # 이 커밋을 배포하기 전에 운영 DB에 적용할 마이그레이션이 있는지 판단한다. DB 접속 정보는 쓰지 않는다.
  # 지금 배포된(infra에 적힌) 커밋과 비교해 prisma/migrations가 달라졌으면 적용 대상으로 본다.
  # 판단할 수 없으면(배포된 커밋을 못 읽거나 갈라진 기록 등) 적용 쪽(사람 승인)으로 기운다.
  migrate-plan:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 배포된 커밋과의 조상 관계를 보려면 전체 기록이 필요하다
      - name: 적용할 마이그레이션이 있는지 확인
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed=true
          deployed=$(gh api repos/swyp-web16th-team2/infra/contents/apps/backend/deployment.yaml --jq .content | base64 -d \
            | grep -Eo "ghcr\.io/${GITHUB_REPOSITORY}:[0-9a-f]{40}" | sort -u || true)
          if [ "$(printf '%s\n' "$deployed" | grep -c .)" = 1 ]; then
            sha=${deployed##*:}
            if git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              if git merge-base --is-ancestor "$GITHUB_SHA" "$sha"; then
                changed=false # 이 커밋은 지금 배포된 것과 같거나 더 오래됐다(deploy도 건너뛴다).
              elif git merge-base --is-ancestor "$sha" "$GITHUB_SHA"; then
                if [ -z "$(git diff --name-only "$sha" "$GITHUB_SHA" -- prisma/migrations)" ]; then changed=false; fi
              fi
            fi
          fi
          echo "배포된 커밋: ${deployed:-읽지 못함}, 적용할 마이그레이션 있음: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # 운영 DB에 마이그레이션을 적용한다. production 환경의 승인자가 승인해야 시작하고,
  # DIRECT_URL 시크릿은 이 환경에 있어서 main 브랜치의 이 작업에서만 읽을 수 있다.
  # 이 작업이 성공하거나 건너뛰어져야 deploy가 돈다(DB가 새 코드보다 먼저 바뀐다).
  migrate:
    needs: [publish, migrate-plan]
    if: github.event_name == 'push' && needs.migrate-plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: db-migrate
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: 운영 DB에 마이그레이션 적용
        shell: bash
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DIRECT_URL// /}" ]; then
            echo "production 환경 시크릿 DIRECT_URL이 없습니다. 레포 Settings > Environments > production에 넣어야 합니다(docs/migrations.md 6절)."
            exit 1
          fi
          # 적용 안 된 마이그레이션만 순서대로 적용한다. 되돌리는 기능은 없다. 비밀번호는 GitHub이 로그에서 가린다.
          npx prisma migrate deploy

  # 이 커밋의 이미지를 infra 레포의 이미지 태그로 반영해 Argo CD가 자동 배포하게 한다.
  # 단, 이 커밋이 지금 배포된 버전보다 "앞선" 커밋일 때만 바꾼다. 그래서 늦게 끝난 옛 실행이나 재실행이
  # 새 버전을 옛 버전으로 되돌리지 못한다. 이 작업은 저장소 전체에서 한 번에 하나만 돌고,
  # 대기 중인 작업은 취소되지 않고 줄을 선다(queue: max).
  # 이 키로 CI가 infra를 바꿀 수 있으므로 키는 이 작업에서만 쓴다(main 병합 때만 실행).
  deploy:
    needs: [publish, migrate-plan, migrate]
    # migrate는 마이그레이션이 없으면 건너뛰어진다. 실패하거나 승인되지 않으면 배포하지 않는다.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.publish.result == 'success' && needs.migrate-plan.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    concurrency:
      group: infra-deploy
      cancel-in-progress: false
      queue: max # 대기 작업을 최대 100개까지 보존한다(기본은 1개라 새 대기 작업이 이전 대기 작업을 취소함).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swyp-web16th-team2/infra
          ref: main
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          path: infra
      - name: infra 이미지 태그 갱신
        shell: bash
        working-directory: infra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # backend 컨테이너의 image 줄에서 값만 읽거나(print) 바꾸는(replace) awk. 블록은 같은 들여쓰기의 다음 컨테이너나
          # 더 바깥 키에서 끝나고, image 줄이 정확히 하나가 아니면 실패한다.
          AWK_BLOCK='{ match($0, /^ */); cur = RLENGTH } NF && inb && cur < ind { inb = 0 } /^ *- name: / { if ($0 ~ /^ *- name: backend$/) { inb = 1; ind = cur } else if (inb && cur == ind) { inb = 0 } }'
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            # 지금 배포된(infra에 적힌) 이미지. ghcr.io/<이 저장소>:<커밋 SHA 40자> 형식이 아니면(다른 레지스트리·저장소 포함) 실패한다.
            cur_image=$(awk "$AWK_BLOCK"' inb && /^ *image: / { print $2; n++ } END { exit n != 1 }' apps/backend/deployment.yaml)
            current=${cur_image##*:}
            if [ "${cur_image%:*}" != "ghcr.io/${GITHUB_REPOSITORY}" ] || ! printf '%s' "$current" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "infra의 현재 이미지($cur_image)가 ghcr.io/${GITHUB_REPOSITORY}:<커밋 SHA> 형식이 아닙니다. 사람이 확인해야 합니다."
              exit 1
            fi
            # 이 커밋이 지금 배포된 커밋보다 앞선 커밋일 때만 바꾼다.
            status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current}...${GITHUB_SHA}" --jq .status)
            case "$status" in
              ahead) ;;
              identical|behind) echo "이 커밋은 지금 배포된 버전과 같거나 더 오래되어 건너뜁니다($status)."; exit 0 ;;
              *) echo "커밋 비교 결과가 예상 밖입니다($status). 사람이 확인해야 합니다."; exit 1 ;;
            esac
            IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}"
            awk -v img="$IMAGE" "$AWK_BLOCK"' inb && /^ *image: / { sub(/image: .*/, "image: " img); n++ } { print } END { exit n != 1 }' apps/backend/deployment.yaml > deployment.yaml.new
            mv deployment.yaml.new apps/backend/deployment.yaml
            if [ "$(git diff --numstat | awk '{print $1 + $2}')" != "2" ]; then echo "image 한 줄 외에 바뀐 곳이 있거나 바뀐 곳이 없습니다."; exit 1; fi
            git config user.name "backend-ci"
            git config user.email "backend-ci@users.noreply.github.com"
            git commit -qam "chore: backend 이미지 태그를 ${GITHUB_SHA::7}로 갱신"
            git push origin HEAD:main && exit 0
            echo "push 실패($i/3), 처음부터 다시 시도합니다."
          done
          exit 1
