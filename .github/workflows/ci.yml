name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR 브랜치는 새 푸시가 오면 이전 실행을 취소한다. main은 실행마다 그룹을 따로 줘서
  # 연달아 병합돼도 앞선 커밋의 이미지 게시(publish)가 취소되지 않게 한다.
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # main에 병합됐을 때만 이미지를 GHCR에 올린다. PR에서는 올리지 않는다.
  publish:
    needs: [check, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 태그는 커밋 SHA만 쓴다. latest 같은 움직이는 태그는 배포 추적이 안 돼서 만들지 않는다.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha

  # infra 레포의 이미지 태그를 "backend main의 현재 최신 커밋"으로 맞춰 Argo CD가 자동 배포하게 한다.
  # 이 실행의 커밋이 아니라 그 시점의 최신 커밋을 기준으로 하므로, 큐에서 밀려 취소된 실행이 있어도
  # 마지막으로 도는 실행이 최신으로 맞춘다. 이 작업은 저장소 전체에서 한 번에 하나만 돈다.
  # 이 키로 CI가 infra를 바꿀 수 있으므로 키는 이 작업에서만 쓴다(main 병합 때만 실행).
  deploy:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: infra-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: swyp-web16th-team2/infra
          ref: main
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
          path: infra
      - name: infra 이미지 태그 갱신
        shell: bash
        working-directory: infra
        run: |
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            # 배포 대상: backend main의 현재 최신 커밋. 조회에 실패하면 실패로 끝낸다.
            tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main)
            tip=${tip%%[[:space:]]*}
            if [ -z "$tip" ]; then echo "backend main 조회에 실패했습니다."; exit 1; fi
            # 그 커밋의 이미지가 아직 없으면(게시 중이거나 그 커밋의 CI가 실패) 건너뛴다. 이미지가 올라오면 그 커밋의 deploy가 처리한다.
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:${GITHUB_REPOSITORY}:pull" | jq -r .token)
            code=$(curl -s -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer ${token}" -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' "https://ghcr.io/v2/${GITHUB_REPOSITORY}/manifests/${tip}")
            case "$code" in
              200) ;;
              404) echo "최신 커밋($tip)의 이미지가 아직 없어 건너뜁니다."; exit 0 ;;
              *) echo "이미지 조회가 예상 밖 응답입니다(HTTP $code)."; exit 1 ;;
            esac
            IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${tip}"
            # name이 backend인 컨테이너의 image 줄 하나만 바꾼다. 같은 들여쓰기의 다음 컨테이너에 닿으면 거기서 멈추고, 정확히 한 줄이 아니면 실패한다.
            awk -v img="$IMAGE" '{ match($0, /^ */); cur = RLENGTH } /^ *- name: / { if ($0 ~ /^ *- name: backend$/) { inb = 1; ind = cur } else if (inb && cur == ind) { inb = 0 } } inb && /^ *image: / { sub(/image: .*/, "image: " img); inb = 0; n++ } { print } END { exit n != 1 }' apps/backend/deployment.yaml > deployment.yaml.new
            mv deployment.yaml.new apps/backend/deployment.yaml
            if git diff --quiet; then echo "이미 같은 태그입니다."; exit 0; fi
            if [ "$(git diff --numstat | awk '{print $1 + $2}')" != "2" ]; then echo "image 한 줄 외에 바뀐 곳이 있습니다."; exit 1; fi
            git config user.name "backend-ci"
            git config user.email "backend-ci@users.noreply.github.com"
            git commit -qam "chore: backend 이미지 태그를 ${tip::7}로 갱신"
            git push origin HEAD:main && exit 0
            echo "push 실패($i/3), 처음부터 다시 시도합니다."
          done
          exit 1
